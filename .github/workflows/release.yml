# A tag v* builds illi as one file for each system and releases them,
# the latest of which install.sh downloads and illi updates itself to.
# Only a tag that names package.json's version, on code whose type check
# and tests pass, is built; only the release job may write. Each job has
# a time limit some times its usual length, so a hang fails in minutes
# instead of running the runner's six hours. Bun 1.4.3 at least: 1.3's
# spawnSync could spin forever over a child already gone (bun#34069),
# which hung the tests here some runs in three. Every file built holds
# Bun's runtime, whose licenses THIRD_PARTY_NOTICES.md gives for this
# version: a new bun-version takes that section anew. Each file is built
# without Bun's own reading of a bunfig.toml and .env from the folder it
# runs in, a project's (src/main.ts says why). Every action is pinned to
# its commit (its tag beside it: a tag can be moved, a commit can't), and
# the release is made by GitHub's own CLI on the runner, so no one else's
# action holds the token that writes; a new version of one is pinned
# anew, by `git ls-remote --tags` on its repository.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: the tag names package.json's version
        run: |
          version="$(bun -e 'console.log(require("./package.json").version)')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME isn't v$version, package.json's version" >&2
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test

  build:
    needs: check
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, target: linux-x64 }
          - { runner: ubuntu-latest, target: linux-arm64 }
          - { runner: macos-latest,  target: darwin-x64 }
          - { runner: macos-latest,  target: darwin-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile --production
      - run: bun build --compile --no-compile-autoload-bunfig --no-compile-autoload-dotenv --minify --target=bun-${{ matrix.target }} src/main.ts src/chat/Seeker.ts --outfile illi-${{ matrix.target }}
      # macOS runs only signed binaries: signed ad hoc
      - if: runner.os == 'macOS'
        run: codesign --force --sign - illi-${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: illi-${{ matrix.target }}
          path: illi-${{ matrix.target }}

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
      - run: sha256sum illi-* > SHA256SUMS
      - name: the release, its files and notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" illi-* SHA256SUMS --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
